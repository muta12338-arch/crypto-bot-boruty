name: Crypto BOT boruty 4.0 research tests
on:
  push:
    branches: [boruty-4.0-research]
    paths: ["research_v4/**", ".github/workflows/research-v4.yml"]
  pull_request:
    branches: [main]
    paths: ["research_v4/**", ".github/workflows/research-v4.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated research tests
        run: python3 -m unittest discover -s research_v4 -v
