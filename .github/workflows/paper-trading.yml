name: Crypto BOT boruty - paper trading 24/7
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trading-engine
  cancel-in-progress: false
jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Testy bezpieczeństwa strategii
        run: python3 -m unittest -v test_bot_engine.py
      - name: Uruchom symulowany silnik
        run: python3 bot_engine.py
      - name: Zapisz stan portfela
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update paper trading portfolio"
            git push
          fi
